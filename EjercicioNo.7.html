<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promociones de Cursos</title>

    <style>
        #tituloPrincipal {
            text-align: center;
            color: darkblue;
        }

        .tarjeta {
            width: 300px;
            background-color: white;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 3px 3px 10px gray;
            padding: 20px;
            margin: 20px;
            display: inline-block;
        }

        .tarjeta h2 {
            text-align: center;
        }

        .boton {
            background-color: blue;
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1 id="tituloPrincipal">Promociones de Cursos</h1>

    <div class="tarjeta">
        <h2>Curso de HTML</h2>
        <p>Aprende a crear páginas web utilizando HTML desde cero.</p>
        <a href="#" class="boton">Inscribirme</a>
    </div>

    <div class="tarjeta">
        <h2>Curso de CSS</h2>
        <p>Aprende a diseñar y mejorar la apariencia de tus páginas web.</p>
        <a href="#" class="boton">Inscribirme</a>
    </div>

    <div class="tarjeta">
        <h2>Curso de Programación</h2>
        <p>Aprende los conceptos básicos de programación de forma sencilla.</p>
        <a href="#" class="boton">Inscribirme</a>
    </div>

</body>
</html>
